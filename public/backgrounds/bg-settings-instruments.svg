  <g transform="translate(1680, 420) rotate(65)" class="stroke-main">
    <rect x="0" y="0" width="180" height="40" rx="6" class="stroke-dark fill-subtle"/>
    <rect x="180" y="4" width="140" height="32" rx="4" class="stroke-main"/>
    <rect x="320" y="8" width="100" height="24" rx="3" class="stroke-light"/>
    <rect x="420" y="11" width="45" height="18" rx="2" class="stroke-dark fill-terracotta"/>
    <line x1="40" y1="0" x2="40" y2="40" class="stroke-accent"/>
    <line x1="120" y1="0" x2="120" y2="40" class="stroke-accent"/>
  </g>

  <!-- Mid-Left: Antique Pocket Chronometer Watch -->
  <g transform="translate(60, 440) rotate(-10)" class="stroke-main">
    <circle cx="110" cy="30" r="22" class="stroke-dark"/>
    <rect x="100" y="45" width="20" height="16" rx="3" class="stroke-dark fill-terracotta"/>
    <circle cx="110" cy="150" r="90" class="stroke-dark fill-subtle"/>
    <circle cx="110" cy="150" r="80" class="stroke-main"/>
    <circle cx="110" cy="150" r="74" stroke-dasharray="1 5" class="stroke-light"/>
    <circle cx="110" cy="150" r="4" fill="#8C735E"/>
    <line x1="110" y1="150" x2="110" y2="95" class="stroke-dark"/>
    <line x1="110" y1="150" x2="148" y2="135" class="stroke-accent"/>
    <circle cx="110" cy="190" r="20" class="stroke-light"/>
    <line x1="110" y1="190" x2="118" y2="182" class="stroke-light"/>
