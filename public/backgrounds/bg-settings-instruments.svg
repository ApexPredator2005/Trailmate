      <circle cx="0" cy="0" r="6" fill="#8C735E" opacity="0.3"/>
      <line x1="0" y1="18" x2="0" y2="120" class="stroke-dark"/>
      <path d="M 0 100 L 16 100 M 0 112 L 20 112 L 20 118 L 12 118 L 12 122 L 0 122" class="stroke-dark"/>
    </g>
    <g transform="translate(50, 70) rotate(25)">
      <path d="M -16 -12 L 0 -24 L 16 -12 L 12 8 L -12 8 Z" class="stroke-accent fill-subtle"/>
      <line x1="0" y1="8" x2="0" y2="105" class="stroke-main"/>
      <path d="M 0 85 L 14 85 M 0 95 L 18 95" class="stroke-accent"/>
    </g>
  </g>

