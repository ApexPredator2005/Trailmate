    <rect x="30" y="216" width="120" height="14" rx="4" class="stroke-dark fill-subtle"/>
    <line x1="42" y1="24" x2="42" y2="216" class="stroke-dark"/>
    <line x1="138" y1="24" x2="138" y2="216" class="stroke-dark"/>
    <path d="M 52 24 C 52 90, 84 116, 90 120 C 96 116, 128 90, 128 24 Z" class="stroke-light fill-subtle"/>
    <path d="M 52 216 C 52 150, 84 124, 90 120 C 96 124, 128 150, 128 216 Z" class="stroke-light fill-subtle"/>
    <path d="M 68 65 Q 90 85 112 65 L 90 118 Z" fill="#C4703D" opacity="0.35"/>
    <path d="M 60 216 C 62 185, 80 170, 90 168 C 100 170, 118 185, 120 216 Z" fill="#C4703D" opacity="0.45"/>
    <line x1="90" y1="120" x2="90" y2="168" stroke="#C4703D" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Bottom-Left Hero: Open Leather Travel Journal & Fountain Pen -->
  <g transform="translate(80, 750) rotate(-4)" class="stroke-main">
    <path d="M 20 40 Q 140 25 240 45 L 240 230 Q 140 210 20 225 Z" class="stroke-dark fill-subtle"/>
    <path d="M 460 40 Q 340 25 240 45 L 240 230 Q 340 210 460 225 Z" class="stroke-dark fill-subtle"/>
    <line x1="240" y1="45" x2="240" y2="230" class="stroke-accent"/>
    <path d="M 240 230 Q 255 260 270 285" class="stroke-accent"/>
    <line x1="50" y1="80" x2="210" y2="80" class="stroke-light"/>
    <line x1="50" y1="105" x2="200" y2="105" class="stroke-light"/>
    <line x1="50" y1="130" x2="215" y2="130" class="stroke-light"/>
    <line x1="50" y1="155" x2="180" y2="155" class="stroke-light"/>
    <line x1="50" y1="180" x2="195" y2="180" class="stroke-light"/>

    <line x1="270" y1="80" x2="430" y2="80" class="stroke-light"/>
    <line x1="270" y1="105" x2="420" y2="105" class="stroke-light"/>
    <line x1="270" y1="130" x2="435" y2="130" class="stroke-light"/>
    <line x1="270" y1="155" x2="400" y2="155" class="stroke-light"/>
    <line x1="270" y1="180" x2="415" y2="180" class="stroke-light"/>

    <g transform="translate(360, 110) rotate(45)">
      <polygon points="0,0 8,30 0,160 -8,30" class="stroke-dark fill-terracotta"/>
      <polygon points="0,0 4,25 0,35 -4,25" fill="#8C735E" opacity="0.6"/>
      <line x1="0" y1="35" x2="0" y2="150" class="stroke-accent"/>
      <circle cx="0" cy="22" r="2" fill="#FAF5EB"/>
    </g>
  </g>

  <!-- Bottom Center: Barometer & Weather Dial -->
  <g transform="translate(680, 800) rotate(3)" class="stroke-main">
    <circle cx="100" cy="100" r="85" class="stroke-dark fill-subtle"/>
    <circle cx="100" cy="100" r="72" class="stroke-main"/>
    <circle cx="100" cy="100" r="66" stroke-dasharray="2 4" class="stroke-light"/>
    <path d="M 45 100 A 55 55 0 0 1 155 100" class="stroke-accent"/>
    <line x1="100" y1="100" x2="130" y2="65" class="stroke-dark"/>
    <circle cx="100" cy="100" r="8" class="stroke-dark fill-terracotta"/>
    <text x="82" y="130" font-family="'Noto Serif', serif" font-size="9" fill="#8C735E" opacity="0.6" letter-spacing="1">BAROMETER</text>
    <text x="88" y="145" font-family="'JetBrains Mono', monospace" font-size="8" fill="#C4703D" opacity="0.7">1013 hPa</text>
  </g>

  <!-- Bottom-Right Hero: Brass Magnifying Glass -->
  <g transform="translate(1360, 720) rotate(-18)" class="stroke-main">
    <circle cx="100" cy="100" r="75" class="stroke-dark fill-subtle"/>
    <circle cx="100" cy="100" r="68" class="stroke-main"/>
    <ellipse cx="80" cy="70" rx="35" ry="18" transform="rotate(-30 80 70)" fill="#FFFFFF" fill-opacity="0.25"/>
    <path d="M 152 152 L 250 250 L 265 235 L 167 137 Z" class="stroke-dark fill-terracotta"/>
    <circle cx="265" cy="255" r="10" class="stroke-dark"/>
    <g opacity="0.4">
      <line x1="45" y1="100" x2="155" y2="100" class="stroke-light"/>
      <line x1="100" y1="45" x2="100" y2="155" class="stroke-light"/>
      <circle cx="100" cy="100" r="40" class="stroke-accent" stroke-dasharray="2 3"/>
    </g>
  </g>

  <!-- Ambient Organic Accents -->
  <g class="stroke-light">
    <g transform="translate(420, 260)">
      <path d="M 0 0 L 40 -20 L 90 -10 L 120 30 L 70 50 Z" stroke-dasharray="2 3"/>
      <circle cx="0" cy="0" r="2.5" fill="#C4703D" opacity="0.6"/>
      <circle cx="40" cy="-20" r="3.5" fill="#8C735E" opacity="0.7"/>
      <circle cx="90" cy="-10" r="2" fill="#5B8C7B" opacity="0.6"/>
      <circle cx="120" cy="30" r="3" fill="#C4703D" opacity="0.6"/>
      <circle cx="70" cy="50" r="2.5" fill="#8C735E" opacity="0.6"/>
    </g>

    <g transform="translate(1220, 240)">
      <path d="M 0 0 L 30 40 L 80 30 L 110 70" stroke-dasharray="2 3"/>
      <circle cx="0" cy="0" r="3" fill="#8C735E" opacity="0.6"/>
      <circle cx="30" cy="40" r="2" fill="#C4703D" opacity="0.6"/>
      <circle cx="80" cy="30" r="3.5" fill="#5B8C7B" opacity="0.7"/>
      <circle cx="110" cy="70" r="2.5" fill="#8C735E" opacity="0.6"/>
    </g>

    <g transform="translate(280, 380)" class="stroke-accent">
      <circle cx="0" cy="0" r="10"/>
      <line x1="-16" y1="0" x2="16" y2="0"/>
      <line x1="0" y1="-16" x2="0" y2="16"/>
    </g>
    <g transform="translate(1620, 320)" class="stroke-sage">
      <circle cx="0" cy="0" r="12"/>
      <line x1="-18" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="-18" x2="0" y2="18"/>
    </g>
    <g transform="translate(1120, 840)" class="stroke-accent">
      <circle cx="0" cy="0" r="8"/>
      <line x1="-14" y1="0" x2="14" y2="0"/>
      <line x1="0" y1="-14" x2="0" y2="14"/>
    </g>
    <g transform="translate(520, 720)" class="stroke-main">
      <circle cx="0" cy="0" r="9"/>
      <line x1="-15" y1="0" x2="15" y2="0"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
    </g>
  </g>
</svg>