<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="parchmentGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F7F2E7"/>
      <stop offset="100%" stop-color="#EDE4D0"/>
    </radialGradient>
    <pattern id="paperGrain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="0.8" fill="#7D6652" fill-opacity="0.08"/>
      <circle cx="85" cy="75" r="1.1" fill="#7D6652" fill-opacity="0.06"/>
      <circle cx="110" cy="15" r="0.6" fill="#7D6652" fill-opacity="0.07"/>
      <circle cx="45" cy="95" r="0.9" fill="#7D6652" fill-opacity="0.06"/>
      <circle cx="70" cy="40" r="0.7" fill="#7D6652" fill-opacity="0.05"/>
    </pattern>
    <style>
      .stroke-main { stroke: #8C735E; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.52; }
      .stroke-dark { stroke: #6E5643; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.58; }
      .stroke-light { stroke: #B29C88; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.42; }
      .stroke-accent { stroke: #C4703D; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.48; }
      .stroke-sage { stroke: #5B8C7B; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.45; }
      .fill-subtle { fill: #8C735E; fill-opacity: 0.05; }
      .fill-terracotta { fill: #C4703D; fill-opacity: 0.07; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#parchmentGlow)"/>
  <rect width="1920" height="1080" fill="url(#paperGrain)"/>

  <!-- Top-Left Hero: Marine Sextant & Coordinate Arc -->
  <g transform="translate(90, 80) rotate(-6)" class="stroke-main">
    <path d="M 120 40 L 40 220 A 180 180 0 0 0 240 220 Z" class="fill-subtle"/>
    <path d="M 25 225 A 200 200 0 0 0 255 225" class="stroke-dark"/>
    <path d="M 45 220 L 45 228 M 75 221 L 75 229 M 105 222 L 105 230 M 135 223 L 135 231 M 165 222 L 165 230 M 195 221 L 195 229 M 225 220 L 225 228" class="stroke-light"/>
    <line x1="120" y1="40" x2="160" y2="225" class="stroke-dark"/>
    <rect x="75" y="70" width="110" height="22" rx="4" transform="rotate(25 75 70)" class="stroke-dark fill-subtle"/>
    <circle cx="120" cy="40" r="14" class="stroke-accent"/>
    <circle cx="120" cy="40" r="5" fill="#8C735E" opacity="0.4"/>
    <rect x="65" y="140" width="24" height="12" rx="2" transform="rotate(-15 65 140)"/>
    <rect x="110" y="24" width="22" height="12" rx="2"/>
    <text x="140" y="255" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8C735E" opacity="0.5" letter-spacing="2">LAT 11°24'N</text>
  </g>

  <!-- Top Center-Left: Drafting Calipers & Dividers -->
  <g transform="translate(560, 60) rotate(12)" class="stroke-main">
    <circle cx="80" cy="30" r="16" class="stroke-dark"/>
    <circle cx="80" cy="30" r="6" fill="#8C735E" opacity="0.4"/>
    <path d="M 72 44 L 20 230 L 16 232"/>
    <path d="M 88 44 L 140 230 L 144 232"/>
    <path d="M 42 120 A 80 80 0 0 1 118 120" class="stroke-light"/>
    <circle cx="80" cy="122" r="6" class="stroke-accent"/>
  </g>

  <!-- Top Center: Celestial Armillary Ring Sphere -->
  <g transform="translate(860, 40) rotate(4)" class="stroke-light">
    <circle cx="120" cy="120" r="100" class="stroke-main fill-subtle"/>
    <ellipse cx="120" cy="120" rx="100" ry="38" transform="rotate(35 120 120)" class="stroke-dark"/>
    <ellipse cx="120" cy="120" rx="100" ry="38" transform="rotate(-35 120 120)" class="stroke-main"/>
    <line x1="120" y1="10" x2="120" y2="230" class="stroke-accent"/>
    <circle cx="120" cy="120" r="22" class="stroke-dark fill-terracotta"/>
    <circle cx="120" cy="120" r="6" fill="#C4703D" opacity="0.4"/>
    <path d="M 50 70 Q 120 110 190 70" stroke-dasharray="4 4"/>
    <path d="M 50 170 Q 120 130 190 170" stroke-dasharray="4 4"/>
  </g>

  <!-- Top-Right Hero: Large Ornate Compass Rose -->
  <g transform="translate(1420, 50) rotate(15)" class="stroke-main">
    <circle cx="180" cy="180" r="140" class="stroke-light"/>
    <circle cx="180" cy="180" r="128" class="stroke-dark"/>
    <circle cx="180" cy="180" r="120" stroke-dasharray="2 6" class="stroke-light"/>
    <!-- North -->
    <polygon points="180,35 192,165 180,180" fill="#C4703D" opacity="0.65"/>
    <polygon points="180,35 168,165 180,180" class="fill-subtle stroke-main"/>
    <!-- South -->
    <polygon points="180,325 168,195 180,180" fill="#8C735E" opacity="0.45"/>
    <polygon points="180,325 192,195 180,180" class="fill-subtle stroke-main"/>
    <!-- East -->
    <polygon points="325,180 195,192 180,180" fill="#8C735E" opacity="0.45"/>
    <polygon points="325,180 195,168 180,180" class="fill-subtle stroke-main"/>
    <!-- West -->
    <polygon points="35,180 165,168 180,180" fill="#8C735E" opacity="0.45"/>
    <polygon points="35,180 165,192 180,180" class="fill-subtle stroke-main"/>
    <!-- NE, NW, SE, SW Points -->
    <polygon points="275,85 188,172 180,180" class="fill-subtle stroke-light"/>
    <polygon points="85,85 172,172 180,180" class="fill-subtle stroke-light"/>
    <polygon points="275,275 188,188 180,180" class="fill-subtle stroke-light"/>
    <polygon points="85,275 172,188 180,180" class="fill-subtle stroke-light"/>
    <!-- Center Pivot -->
    <circle cx="180" cy="180" r="16" class="stroke-dark fill-terracotta"/>
    <circle cx="180" cy="180" r="6" fill="#1E3A34" opacity="0.5"/>
    <text x="175" y="24" font-family="'Noto Serif', serif" font-weight="bold" font-size="20" fill="#C4703D" opacity="0.7">N</text>
    <text x="176" y="352" font-family="'Noto Serif', serif" font-weight="bold" font-size="16" fill="#8C735E" opacity="0.6">S</text>
    <text x="338" y="186" font-family="'Noto Serif', serif" font-weight="bold" font-size="16" fill="#8C735E" opacity="0.6">E</text>
    <text x="10" y="186" font-family="'Noto Serif', serif" font-weight="bold" font-size="16" fill="#8C735E" opacity="0.6">W</text>
  </g>

