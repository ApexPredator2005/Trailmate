<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="heritageGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="60%" stop-color="#F8F3E8"/>
      <stop offset="100%" stop-color="#EFE6D4"/>
    </radialGradient>
    <pattern id="heritageGrain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="20" r="0.8" fill="#8B4A28" fill-opacity="0.06"/>
      <circle cx="80" cy="65" r="1.1" fill="#8B4A28" fill-opacity="0.05"/>
      <circle cx="105" cy="100" r="0.6" fill="#8B4A28" fill-opacity="0.06"/>
      <circle cx="45" cy="85" r="0.9" fill="#8B4A28" fill-opacity="0.05"/>
    </pattern>
    <style>
      .stroke-terracotta { stroke: #8B4A28; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.54; }
      .stroke-dark-sepia { stroke: #61331B; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.60; }
      .stroke-stone { stroke: #A38570; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.42; }
      .stroke-gold { stroke: #C4973B; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.48; }
      .stroke-navy { stroke: #2D4A5E; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.45; }
      .fill-terracotta-subtle { fill: #8B4A28; fill-opacity: 0.05; }
      .fill-stamp { fill: #BA1A1A; fill-opacity: 0.08; }
      .fill-gold { fill: #C4973B; fill-opacity: 0.08; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#heritageGlow)"/>
  <rect width="1920" height="1080" fill="url(#heritageGrain)"/>

  <!-- Top-Left Hero: Grand Classical Triumphal Arch of Heritage -->
  <g transform="translate(80, 70) rotate(-4)" class="stroke-terracotta">
    <!-- Arch Structure -->
    <rect x="20" y="30" width="220" height="30" class="stroke-dark-sepia fill-gold"/>
    <rect x="10" y="60" width="240" height="18" class="stroke-terracotta fill-terracotta-subtle"/>
    <!-- Left Pillar -->
    <rect x="30" y="78" width="55" height="150" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <line x1="45" y1="88" x2="45" y2="218" class="stroke-stone"/>
    <line x1="60" y1="88" x2="60" y2="218" class="stroke-stone"/>
    <line x1="75" y1="88" x2="75" y2="218" class="stroke-stone"/>
    <!-- Right Pillar -->
    <rect x="175" y="78" width="55" height="150" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <line x1="190" y1="88" x2="190" y2="218" class="stroke-stone"/>
    <line x1="205" y1="88" x2="205" y2="218" class="stroke-stone"/>
    <line x1="220" y1="88" x2="220" y2="218" class="stroke-stone"/>
    <!-- Center Vault Arch -->
    <path d="M 85 228 L 85 140 A 45 45 0 0 1 175 140 L 175 228" class="stroke-dark-sepia fill-gold"/>
    <circle cx="130" cy="115" r="12" class="stroke-gold"/>
    <!-- Base Pedestal -->
    <rect x="15" y="228" width="230" height="20" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <text x="80" y="50" font-family="'Noto Serif', serif" font-weight="bold" font-size="10" fill="#8B4A28" opacity="0.6" letter-spacing="3">MONUMENTA</text>
  </g>

  <!-- Top Center: Vintage Airmail Envelope & Wings -->
  <g transform="translate(680, 50) rotate(6)" class="stroke-terracotta">
    <!-- Envelope Body -->
    <rect x="30" y="20" width="180" height="120" rx="8" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Fold Lines -->
    <line x1="30" y1="20" x2="120" y2="85" class="stroke-terracotta"/>
    <line x1="210" y1="20" x2="120" y2="85" class="stroke-terracotta"/>
    <line x1="30" y1="140" x2="95" y2="70" class="stroke-stone"/>
    <line x1="210" y1="140" x2="145" y2="70" class="stroke-stone"/>
    <!-- Airmail Chevron Border Trim -->
    <path d="M 30 20 L 45 20 L 35 30 L 30 30 Z" fill="#BA1A1A" opacity="0.5"/>
    <path d="M 55 20 L 70 20 L 60 30 L 45 30 Z" fill="#2D4A5E" opacity="0.5"/>
    <path d="M 80 20 L 95 20 L 85 30 L 70 30 Z" fill="#BA1A1A" opacity="0.5"/>
    <!-- Stamp with Cancel Postmark -->
    <rect x="155" y="32" width="42" height="34" class="stroke-terracotta fill-stamp"/>
    <circle cx="150" cy="55" r="24" stroke="#BA1A1A" stroke-dasharray="2 3" opacity="0.6"/>
    <line x1="120" y1="50" x2="180" y2="50" stroke="#BA1A1A" opacity="0.6"/>
    <line x1="120" y1="60" x2="180" y2="60" stroke="#BA1A1A" opacity="0.6"/>
  </g>

  <!-- Top-Right Hero: Ancient Architectural Palace Dome & Colonnade -->
  <g transform="translate(1380, 50) rotate(-3)" class="stroke-terracotta">
    <!-- Bulbous Dome -->
    <path d="M 150 15 C 170 45, 230 75, 230 130 C 230 160, 200 170, 150 170 C 100 170, 70 160, 70 130 C 70 75, 130 45, 150 15 Z" class="stroke-dark-sepia fill-gold"/>
    <!-- Spire Finial -->
    <line x1="150" y1="0" x2="150" y2="25" class="stroke-gold" stroke-width="2.5"/>
    <circle cx="150" cy="0" r="4" fill="#C4973B"/>
    <!-- Drum & Arches -->
    <rect x="80" y="170" width="140" height="30" class="stroke-terracotta fill-terracotta-subtle"/>
    <path d="M 95 200 A 10 10 0 0 1 115 200 M 125 200 A 10 10 0 0 1 145 200 M 155 200 A 10 10 0 0 1 175 200 M 185 200 A 10 10 0 0 1 205 200" class="stroke-terracotta"/>
    <!-- Main Base -->
    <rect x="50" y="200" width="200" height="40" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <line x1="70" y1="200" x2="70" y2="240" class="stroke-stone"/>
    <line x1="110" y1="200" x2="110" y2="240" class="stroke-stone"/>
    <line x1="150" y1="200" x2="150" y2="240" class="stroke-stone"/>
    <line x1="190" y1="200" x2="190" y2="240" class="stroke-stone"/>
    <line x1="230" y1="200" x2="230" y2="240" class="stroke-stone"/>
  </g>

  <!-- Mid-Left: Circular Visa & Passport Entry Stamp Cancel Marks -->
  <g transform="translate(80, 440) rotate(-12)" class="stroke-terracotta">
    <!-- Double Ring Stamp -->
    <circle cx="90" cy="90" r="75" stroke="#BA1A1A" stroke-width="2.2" opacity="0.6"/>
    <circle cx="90" cy="90" r="66" stroke="#BA1A1A" stroke-dasharray="2 4" opacity="0.5"/>
    <path d="M 30 75 L 150 75 M 30 105 L 150 105" stroke="#BA1A1A" opacity="0.5"/>
    <text x="44" y="65" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#BA1A1A" opacity="0.7" letter-spacing="1">IMMIGRATION</text>
    <text x="40" y="93" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#BA1A1A" opacity="0.8">★ 18 AUG 2026 ★</text>
    <text x="56" y="122" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#BA1A1A" opacity="0.7">PORT ENTRY</text>
  </g>

  <!-- Mid Center-Left: Classical Corinthian Column Ruins -->
  <g transform="translate(360, 480) rotate(8)" class="stroke-terracotta">
    <path d="M 20 20 Q 50 10 80 20 L 75 35 Q 50 30 25 35 Z" class="stroke-dark-sepia fill-gold"/>
    <rect x="25" y="35" width="50" height="150" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Flutes -->
    <line x1="35" y1="38" x2="35" y2="182" class="stroke-stone"/>
    <line x1="45" y1="38" x2="45" y2="182" class="stroke-stone"/>
    <line x1="55" y1="38" x2="55" y2="182" class="stroke-stone"/>
    <line x1="65" y1="38" x2="65" y2="182" class="stroke-stone"/>
    <!-- Plinth Base -->
    <rect x="15" y="185" width="70" height="20" class="stroke-dark-sepia fill-terracotta-subtle"/>
  </g>

  <!-- Mid Center-Right: Antique Wax Seal Stamp & Ribbon -->
  <g transform="translate(1380, 460) rotate(15)" class="stroke-terracotta">
    <!-- Hanging Ribbons -->
    <polygon points="50,90 30,190 55,175 75,190" class="stroke-terracotta fill-stamp"/>
    <polygon points="80,90 70,190 95,175 115,190" class="stroke-terracotta fill-stamp"/>
    <!-- Wax Seal Roundel -->
    <path d="M 65 15 C 80 10, 110 20, 115 35 C 125 45, 128 75, 118 90 C 110 105, 80 115, 65 110 C 50 115, 20 105, 12 90 C 2 75, 5 45, 15 35 C 20 20, 50 10, 65 15 Z" class="stroke-dark-sepia fill-stamp"/>
    <circle cx="65" cy="62" r="32" stroke="#BA1A1A" stroke-width="1.8" opacity="0.7"/>
    <!-- Fleur / Star Center -->
    <polygon points="65,42 70,57 85,62 70,67 65,82 60,67 45,62 60,57" fill="#C4973B" opacity="0.65"/>
  </g>

  <!-- Bottom-Left Hero: Heritage Steam Locomotive Train -->
  <g transform="translate(80, 750) rotate(-2)" class="stroke-terracotta">
    <!-- Steam Plumes -->
    <circle cx="95" cy="20" r="18" class="stroke-stone fill-terracotta-subtle"/>
    <circle cx="70" cy="-5" r="26" class="stroke-stone fill-terracotta-subtle"/>
    <circle cx="35" cy="-25" r="35" class="stroke-stone fill-terracotta-subtle"/>
    <!-- Chimney Stack -->
    <polygon points="85,35 105,35 102,75 88,75" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Boiler Barrel -->
    <rect x="80" y="75" width="160" height="65" rx="8" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Headlamp -->
    <rect x="235" y="85" width="18" height="25" rx="4" class="stroke-gold fill-gold"/>
    <!-- Cab -->
    <rect x="20" y="50" width="65" height="90" rx="4" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <rect x="30" y="60" width="22" height="24" rx="2" class="stroke-terracotta fill-gold"/>
    <!-- Wheels -->
    <circle cx="60" cy="155" r="22" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <circle cx="115" cy="155" r="22" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <circle cx="170" cy="155" r="22" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <circle cx="220" cy="162" r="15" class="stroke-dark-sepia"/>
    <!-- Connecting Rod -->
    <line x1="60" y1="155" x2="170" y2="155" class="stroke-gold" stroke-width="3"/>
    <!-- Cowcatcher -->
    <polygon points="240,150 265,175 235,175" class="stroke-dark-sepia"/>
    <!-- Track Rails -->
    <line x1="0" y1="180" x2="280" y2="180" class="stroke-dark-sepia" stroke-width="2.5"/>
  </g>

  <!-- Bottom Center: Vintage Steamer Trunk Luggage -->
  <g transform="translate(680, 770) rotate(3)" class="stroke-terracotta">
    <!-- Trunk Body -->
    <rect x="30" y="30" width="190" height="110" rx="8" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Brass Reinforced Corners -->
    <path d="M 30 50 L 50 30 M 220 50 L 200 30 M 30 120 L 50 140 M 220 120 L 200 140" class="stroke-gold" stroke-width="2"/>
    <!-- Leather Straps -->
    <rect x="75" y="30" width="14" height="110" class="stroke-dark-sepia fill-gold"/>
    <rect x="160" y="30" width="14" height="110" class="stroke-dark-sepia fill-gold"/>
    <!-- Center Brass Clasp -->
    <rect x="110" y="70" width="30" height="24" rx="4" class="stroke-gold fill-gold"/>
    <!-- Top Leather Handle -->
    <path d="M 100 30 C 100 15, 150 15, 150 30" class="stroke-dark-sepia" stroke-width="3.5"/>
    <!-- Hotel Luggage Stickers -->
    <circle cx="65" cy="95" r="16" class="stroke-terracotta fill-stamp"/>
    <rect x="180" y="85" width="25" height="18" rx="2" class="stroke-navy fill-terracotta-subtle"/>
  </g>

  <!-- Bottom-Right Hero: Desktop Antique Globe on Brass Meridian Stand -->
  <g transform="translate(1380, 720) rotate(-6)" class="stroke-terracotta">
    <!-- Meridian Ring -->
    <circle cx="120" cy="110" r="85" class="stroke-gold"/>
    <!-- Globe Sphere -->
    <circle cx="120" cy="110" r="75" class="stroke-dark-sepia fill-terracotta-subtle"/>
    <!-- Latitude & Longitude Graticule -->
    <ellipse cx="120" cy="110" rx="75" ry="30" class="stroke-stone"/>
    <ellipse cx="120" cy="110" rx="75" ry="60" class="stroke-stone"/>
    <line x1="120" y1="35" x2="120" y2="185" class="stroke-stone"/>
    <!-- Continents Silhouettes -->
    <path d="M 85 85 Q 110 70 135 90 Q 150 115 130 135 Q 95 125 85 85 Z" class="stroke-gold fill-gold"/>
    <!-- Brass Stand Base & Stem -->
    <path d="M 120 195 L 120 240 L 70 260 L 170 260 L 120 240" class="stroke-gold fill-gold"/>
  </g>

  <!-- Ambient Waypoint Symbols & Star Accents -->
  <g class="stroke-stone">
    <g transform="translate(420, 240)" class="stroke-gold">
      <polygon points="20,0 24,14 38,14 26,22 30,36 20,27 10,36 14,22 2,14 16,14"/>
    </g>
    <g transform="translate(1220, 220)" class="stroke-gold">
      <polygon points="15,0 18,10 28,10 20,16 23,26 15,20 7,26 10,16 2,10 12,10"/>
    </g>
    <g transform="translate(280, 360)" class="stroke-terracotta">
      <circle cx="0" cy="0" r="8"/>
      <line x1="-12" y1="0" x2="12" y2="0"/>
      <line x1="0" y1="-12" x2="0" y2="12"/>
    </g>
    <g transform="translate(1620, 340)" class="stroke-navy">
      <circle cx="0" cy="0" r="10"/>
      <line x1="-15" y1="0" x2="15" y2="0"/>
      <line x1="0" y1="-15" x2="0" y2="15"/>
    </g>
  </g>
</svg>