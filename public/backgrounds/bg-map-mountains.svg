<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="alpineGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="60%" stop-color="#F3EFE6"/>
      <stop offset="100%" stop-color="#E5DFCE"/>
    </radialGradient>
    <pattern id="alpineGrain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="45" r="0.8" fill="#4B6354" fill-opacity="0.06"/>
      <circle cx="95" cy="85" r="1.1" fill="#4B6354" fill-opacity="0.05"/>
      <circle cx="115" cy="20" r="0.6" fill="#4B6354" fill-opacity="0.06"/>
      <circle cx="50" cy="105" r="0.9" fill="#4B6354" fill-opacity="0.05"/>
    </pattern>
    <style>
      .stroke-pine { stroke: #385444; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.52; }
      .stroke-pine-dark { stroke: #253D30; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.60; }
      .stroke-contour { stroke: #7B9986; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.38; }
      .stroke-terracotta { stroke: #C4703D; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.50; }
      .stroke-wood { stroke: #8C735E; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.45; }
      .fill-pine-subtle { fill: #385444; fill-opacity: 0.05; }
      .fill-snow { fill: #FFFFFF; fill-opacity: 0.60; }
      .fill-amber { fill: #D1A847; fill-opacity: 0.12; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#alpineGlow)"/>
  <rect width="1920" height="1080" fill="url(#alpineGrain)"/>

  <!-- Flowing Topographic Contour Lines across the background -->
  <g class="stroke-contour">
    <path d="M 0 320 C 300 280, 600 360, 960 300 C 1320 240, 1600 330, 1920 280" />
    <path d="M 0 360 C 320 310, 620 400, 960 340 C 1300 280, 1580 370, 1920 320" />
    <path d="M 0 400 C 340 340, 640 440, 960 380 C 1280 320, 1560 410, 1920 360" />
    <path d="M 0 720 C 380 660, 720 780, 1100 700 C 1480 620, 1720 750, 1920 700" />
    <path d="M 0 760 C 400 700, 740 820, 1100 740 C 1460 660, 1700 790, 1920 740" />
    <path d="M 0 800 C 420 740, 760 860, 1100 780 C 1440 700, 1680 830, 1920 780" />
  </g>

  <!-- Top-Left Hero: Dramatic Snow-Capped Mountain Range -->
  <g transform="translate(60, 60)" class="stroke-pine">
    <polygon points="180,30 290,240 70,240" class="stroke-pine-dark fill-pine-subtle"/>
    <!-- Snow Cap -->
    <path d="M 180 30 L 225 110 Q 195 130 180 115 Q 165 130 135 110 Z" class="stroke-pine-dark fill-snow"/>
    <!-- Ridge Shadow Line -->
    <line x1="180" y1="30" x2="160" y2="240" class="stroke-pine-dark"/>
    <!-- Secondary Peak -->
    <polygon points="310,80 410,240 210,240" class="stroke-pine fill-pine-subtle"/>
    <path d="M 310 80 L 348 140 Q 325 155 310 142 Q 295 155 272 140 Z" class="stroke-pine fill-snow"/>
    <!-- Distant Crest -->
    <polygon points="90,110 170,240 10,240" class="stroke-contour fill-pine-subtle"/>
    <text x="140" y="265" font-family="'JetBrains Mono', monospace" font-size="11" fill="#385444" opacity="0.6" letter-spacing="2">ELEV 2,637M ▲</text>
  </g>

  <!-- Top Center: Aerial Ski Gondola & Cable Car -->
  <g transform="translate(760, 40)" class="stroke-pine">
    <!-- Cableway Line -->
    <line x1="-100" y1="70" x2="400" y2="130" class="stroke-pine-dark" stroke-width="2.2"/>
    <!-- Gondola 1 -->
    <g transform="translate(140, 100) rotate(5)">
      <!-- Hanger Arm & Wheel -->
      <circle cx="20" cy="0" r="5" class="stroke-pine-dark"/>
      <path d="M 20 0 L 20 40 L 40 40 L 40 60 L 0 60 L 0 40 L 20 40" class="stroke-pine-dark"/>
      <!-- Gondola Cabin -->
      <rect x="-15" y="60" width="70" height="55" rx="12" class="stroke-pine-dark fill-amber"/>
      <!-- Windows -->
      <rect x="-5" y="70" width="20" height="22" rx="3" class="stroke-pine fill-snow"/>
      <rect x="25" y="70" width="20" height="22" rx="3" class="stroke-pine fill-snow"/>
      <!-- Ski Racks -->
      <line x1="55" y1="75" x2="65" y2="115" class="stroke-terracotta"/>
      <line x1="58" y1="75" x2="68" y2="115" class="stroke-pine"/>
    </g>
  </g>

  <!-- Top-Right Hero: Alpine Compass Rose & Sunburst -->
  <g transform="translate(1440, 60)" class="stroke-pine">
    <circle cx="160" cy="160" r="120" class="stroke-contour"/>
    <circle cx="160" cy="160" r="105" class="stroke-pine-dark"/>
    <circle cx="160" cy="160" r="98" stroke-dasharray="3 5" class="stroke-contour"/>
    <!-- Alpine Sunburst Peaks -->
    <polygon points="160,40 170,145 160,160" fill="#385444" opacity="0.6"/>
    <polygon points="160,40 150,145 160,160" class="stroke-pine fill-snow"/>
    <polygon points="160,280 150,175 160,160" fill="#385444" opacity="0.4"/>
    <polygon points="160,280 170,175 160,160" class="stroke-pine fill-snow"/>
    <polygon points="280,160 175,170 160,160" fill="#385444" opacity="0.4"/>
    <polygon points="280,160 175,150 160,160" class="stroke-pine fill-snow"/>
    <polygon points="40,160 145,150 160,160" fill="#385444" opacity="0.4"/>
    <polygon points="40,160 145,170 160,160" class="stroke-pine fill-snow"/>
    <circle cx="160" cy="160" r="14" class="stroke-terracotta fill-amber"/>
    <circle cx="160" cy="160" r="5" fill="#253D30"/>
    <text x="154" y="28" font-family="'Noto Serif', serif" font-weight="bold" font-size="18" fill="#385444" opacity="0.8">N</text>
  </g>

  <!-- Mid-Left: Pine & Fir Forest Cluster -->
  <g transform="translate(60, 440)" class="stroke-pine">
    <!-- Tree 1 -->
    <g transform="translate(40, 0)">
      <polygon points="40,0 65,45 52,45 75,90 60,90 85,140 50,140 50,170 30,170 30,140 -5,140 20,90 5,90 28,45 15,45" class="stroke-pine-dark fill-pine-subtle"/>
    </g>
    <!-- Tree 2 -->
    <g transform="translate(120, 30)">
      <polygon points="35,0 55,40 45,40 65,80 52,80 72,125 42,125 42,150 28,150 28,125 0,125 20,80 7,80 27,40 17,40" class="stroke-pine fill-pine-subtle"/>
    </g>
    <!-- Tree 3 -->
    <g transform="translate(0, 50)">
      <polygon points="30,0 48,35 38,35 55,70 44,70 60,110 36,110 36,130 24,130 24,110 0,110 16,70 5,70 22,35 12,35" class="stroke-pine fill-pine-subtle"/>
    </g>
  </g>

  <!-- Mid Center-Left: Crossed Ice Axes & Climbing Rope Coil -->
  <g transform="translate(360, 480) rotate(-15)" class="stroke-pine">
    <!-- Ice Axe 1 -->
    <g transform="rotate(35 60 60)">
      <rect x="56" y="-10" width="8" height="150" rx="3" class="stroke-pine-dark fill-amber"/>
      <!-- Pick & Adze Head -->
      <path d="M 15 -12 Q 60 -5 105 -15 L 100 -5 Q 60 2 20 -2 Z" class="stroke-pine-dark fill-snow"/>
      <circle cx="60" cy="-6" r="4" class="stroke-terracotta"/>
    </g>
    <!-- Ice Axe 2 -->
    <g transform="rotate(-35 60 60)">
      <rect x="56" y="-10" width="8" height="150" rx="3" class="stroke-pine-dark fill-amber"/>
      <path d="M 15 -12 Q 60 -5 105 -15 L 100 -5 Q 60 2 20 -2 Z" class="stroke-pine-dark fill-snow"/>
      <circle cx="60" cy="-6" r="4" class="stroke-terracotta"/>
    </g>
    <!-- Rope Coil Loop -->
    <ellipse cx="60" cy="65" rx="32" ry="18" class="stroke-terracotta" stroke-dasharray="4 2"/>
    <ellipse cx="60" cy="70" rx="30" ry="16" class="stroke-terracotta" stroke-dasharray="4 2"/>
    <ellipse cx="60" cy="75" rx="28" ry="14" class="stroke-terracotta" stroke-dasharray="4 2"/>
  </g>

  <!-- Mid Center-Right: Alpine Snow Goggles & Mountain Boots -->
  <g transform="translate(1380, 480) rotate(8)" class="stroke-pine">
    <!-- Snow Goggles -->
    <g transform="translate(20, 0)">
      <rect x="10" y="20" width="130" height="42" rx="20" class="stroke-pine-dark fill-pine-subtle"/>
      <ellipse cx="45" cy="41" rx="22" ry="14" class="stroke-terracotta fill-amber"/>
      <ellipse cx="105" cy="41" rx="22" ry="14" class="stroke-terracotta fill-amber"/>
      <line x1="67" y1="41" x2="83" y2="41" class="stroke-pine-dark" stroke-width="3"/>
      <!-- Strap -->
      <path d="M 10 36 C -15 36, -15 46, -30 46" class="stroke-pine" stroke-width="4"/>
      <path d="M 140 36 C 165 36, 165 46, 180 46" class="stroke-pine" stroke-width="4"/>
    </g>
    <!-- Mountain Trail Signpost -->
    <g transform="translate(40, 100)">
      <rect x="50" y="0" width="8" height="120" class="stroke-wood fill-pine-subtle"/>
      <!-- Arrow Sign Right -->
      <polygon points="10,15 90,15 105,30 90,45 10,45" class="stroke-pine-dark fill-snow"/>
      <text x="18" y="34" font-family="'JetBrains Mono', monospace" font-size="9" fill="#253D30" font-weight="bold">SUMMIT ➔</text>
      <!-- Arrow Sign Left -->
      <polygon points="80,55 0,55 -15,70 0,85 80,85" class="stroke-pine-dark fill-amber"/>
      <text x="-5" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C4703D" font-weight="bold">BASECAMP</text>
    </g>
  </g>

  <!-- Bottom-Left Hero: Basecamp Canvas Expedition Tent -->
  <g transform="translate(100, 740) rotate(2)" class="stroke-pine">
    <!-- Tent Front Triangle -->
    <polygon points="120,20 220,180 20,180" class="stroke-pine-dark fill-pine-subtle"/>
    <!-- Tent Flap Opening -->
    <polygon points="120,20 140,180 100,180" class="stroke-terracotta fill-amber"/>
    <!-- Guy Ropes & Pegs -->
    <line x1="120" y1="20" x2="-10" y2="185" class="stroke-contour"/>
    <line x1="120" y1="20" x2="250" y2="185" class="stroke-contour"/>
    <circle cx="-10" cy="185" r="3" class="stroke-wood"/>
    <circle cx="250" cy="185" r="3" class="stroke-wood"/>
    <!-- Tent Side Extension -->
    <polygon points="120,20 250,50 330,190 220,180" class="stroke-pine fill-pine-subtle"/>
  </g>

  <!-- Bottom Center: Wilderness Campfire & Kettle -->
  <g transform="translate(700, 780)" class="stroke-pine">
    <!-- Wood Logs -->
    <line x1="30" y1="135" x2="130" y2="155" class="stroke-wood" stroke-width="6"/>
    <line x1="130" y1="135" x2="30" y2="155" class="stroke-wood" stroke-width="6"/>
    <!-- Dancing Flame Facets -->
    <path d="M 80 40 C 95 65, 115 85, 110 115 C 105 135, 55 135, 50 115 C 45 85, 65 65, 80 40 Z" class="stroke-terracotta fill-amber"/>
    <path d="M 80 75 C 90 90, 98 105, 95 120 C 90 130, 70 130, 65 120 C 62 105, 70 90, 80 75 Z" fill="#C4703D" opacity="0.6"/>
    <!-- Sparks -->
    <circle cx="75" cy="25" r="2.5" fill="#C4703D"/>
    <circle cx="95" cy="15" r="2" fill="#D1A847"/>
    <circle cx="60" cy="35" r="1.5" fill="#C4703D"/>
  </g>

  <!-- Bottom-Right Hero: Thermos Flask & Hiking Backpack -->
  <g transform="translate(1380, 740) rotate(-6)" class="stroke-pine">
    <!-- Rucksack Body -->
    <rect x="40" y="40" width="130" height="160" rx="24" class="stroke-pine-dark fill-pine-subtle"/>
    <!-- Top Lid -->
    <path d="M 35 45 Q 105 15 175 45 L 170 75 L 40 75 Z" class="stroke-pine-dark fill-amber"/>
    <!-- Front Pocket -->
    <rect x="60" y="95" width="90" height="75" rx="10" class="stroke-pine fill-snow"/>
    <!-- Webbing Straps -->
    <line x1="75" y1="45" x2="75" y2="190" class="stroke-terracotta" stroke-width="2"/>
    <line x1="135" y1="45" x2="135" y2="190" class="stroke-terracotta" stroke-width="2"/>
    <!-- Bedroll on top -->
    <rect x="25" y="10" width="160" height="28" rx="14" class="stroke-terracotta fill-pine-subtle"/>
  </g>

  <!-- Soaring Alpine Birds & Ambient Mountain Waypoint Coordinates -->
  <g class="stroke-pine">
    <g transform="translate(480, 220)">
      <path d="M 0 0 Q 15 -10 30 0 Q 45 -10 60 0" stroke-width="1.6"/>
    </g>
    <g transform="translate(560, 180) scale(0.7)">
      <path d="M 0 0 Q 15 -10 30 0 Q 45 -10 60 0" stroke-width="1.6"/>
    </g>
    <g transform="translate(1220, 200) scale(0.85)">
      <path d="M 0 0 Q 15 -10 30 0 Q 45 -10 60 0" stroke-width="1.6"/>
    </g>
    <g transform="translate(1300, 160) scale(0.6)">
      <path d="M 0 0 Q 15 -10 30 0 Q 45 -10 60 0" stroke-width="1.6"/>
    </g>
  </g>
</svg>